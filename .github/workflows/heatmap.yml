name: Generate Contribution Heatmap

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-heatmap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests Pillow

      - name: Generate heatmap image
        env:
          GITHUB_USERNAME: divyanshrawat7
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_heatmap.py

      - name: Commit and push heatmap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heatmap.png
          git diff --cached --quiet || git commit -m "chore: update contribution heatmap [skip ci]"
          git push
